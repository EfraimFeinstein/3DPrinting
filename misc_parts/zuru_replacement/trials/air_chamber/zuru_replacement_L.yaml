# Zuru replacement wheel + extension (millimeters unless noted).

wheel_od: 28.0
wheel_thickness: 5.0

# o ring fit from B
o_ring_cord_diameter: 2.1
o_ring_groove_radial_depth: 2.1
o_ring_groove_axial_width_factor: 1.25

extension_length: 20.0
extension_width: 9.0
extension_thickness_at_wheel: 10.5
extension_thickness_at_end: 4.0
extension_flat_under_start_y: 12.0

# through hole diameter copy from C + 0.1 to add tolerance
through_hole_diameter: 5.3
# increase edge offset. probably nominally 1.5, 
# though it might be up to 1.7, so this will be G+0.1
through_hole_edge_offset: 1.8

# screw hole diameter should be larger than D
# using the optimized screw hole diameter from G
screw_hole_diameter: 2.6
# screw hole centering features copy from D
# pushing the screw hole a bit farther from the wheel
screw_hole_center_from_wheel_face: 4.2
screw_ring_cutout_inner_diameter: 4.3
screw_ring_cutout_outer_diameter: 8.3
screw_ring_cutout_depth: 5.3
screw_ring_trim_depth: 1.3

wheel_label_text: "L"
wheel_label_height: 4.0
wheel_label_depth: 0.4
